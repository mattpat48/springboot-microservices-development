global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'openjob-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'gateway:9000'
          - 'user-microservice:9044'
          - 'job-microservice:9055'
          - 'discovery-server:8761'
          - 'config-server:8888'
        labels:
          environment: 'production'
